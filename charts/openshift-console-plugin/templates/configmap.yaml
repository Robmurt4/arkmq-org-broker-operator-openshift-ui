apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "openshift-console-plugin.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openshift-console-plugin.labels" . | nindent 4 }}
data:
  nginx.conf: |-
{{ .Files.Get "files/nginx.conf" | replace "9443" (printf "%v" .Values.plugin.port) | indent 4 }}
